name: sinfagram
description: "Sinfagram - Oʻzbek maktab oʻquvchilari uchun ijtimoiy tarmoq"

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # --- Sinfagram fixed stack (docs/02) ---
  flutter_localizations:
    sdk: flutter
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^14.6.2
  lucide_icons_flutter: ^3.0.0
  intl: ^0.20.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  # --- legacy prototype deps (retained until old code is removed) ---
  bloc: ^8.1.4
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.0
  cupertino_icons: ^1.0.8
  iconsax_plus: ^1.0.0
  curved_navigation_bar: ^1.0.6
  dropdown_button2: ^2.3.9
  file_picker: ^8.1.6
  firebase_auth: ^5.4.0
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.0
  firebase_storage: ^12.4.0
  flutter:
    sdk: flutter
  flutter_emoji: ^2.5.1
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.1.2
  like_button: ^2.0.5
  modal_progress_hud_nsn: ^0.5.1
  path_provider: ^2.1.5
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  story_view: ^0.16.5
  toast: ^0.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true
  assets:
    - assets/cars/
    - assets/flowers/
  fonts:
    # "Play" redesign — rounded, friendly families (Baloo 2 for display/initials,
    # Fredoka for everything else). Variable fonts; Flutter maps fontWeight to the
    # wght axis. Bundled per docs/11 §11.7 (never fetched at runtime).
    - family: Fredoka
      fonts:
        - asset: fonts/fredoka/Fredoka-Variable.ttf
    - family: Baloo 2
      fonts:
        - asset: fonts/baloo2/Baloo2-Variable.ttf
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Regular.ttf
        - asset: fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: fonts/chalk/Caveat.ttf
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
    - family: MomoTrust
      fonts:
        - asset: fonts/MomoTrustDisplay-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: fonts/Pacifico-Regular.ttf
    - family: SourceSansPro
      fonts:
        - asset: fonts/SourceSansPro-Regular.ttf
        - asset: fonts/SourceSansPro-Italic.ttf
          style: italic
        - asset: fonts/SourceSansPro-Light.ttf
          weight: 100
        - asset: fonts/SourceSansPro-SemiBold.ttf
          weight: 700
    - family: Billabong
      fonts:
        - asset: fonts/FontsFree-Net-Billabong.ttf
    - family: Metropolis
      fonts:
        - asset: fonts/Metropolis-Regular.otf
    #- asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
